<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kartu ID Karyawan — PT Murinda Sentra Baja</title>
<link rel="icon" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<style>
:root{--ink:#0a1243;--steel:#1f3a5f;--orange:#1590e8;--orange-d:#0e72bd;--mist:#eef1f5;--line:#d8dee7;--muted:#5b6b80;--tint:#f2f5f9;--display:'Barlow Condensed','Arial Narrow',sans-serif;--slab:'Roboto Slab',Georgia,serif;--navy:#0a1243;--blue:#1590e8;--pale:#e4f1fd;--sans:'Manrope','Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);color:var(--ink);background:var(--mist);min-height:100vh}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

/* ---------- Halaman ---------- */
.top{display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 28px;background:#fff;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px}
.brand img{height:30px}
.brand b{font-size:15px;font-weight:800;padding-left:14px;border-left:1px solid var(--line)}
.sync{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:#f5a524}
.sync.online i{background:#1fa971}
.sync.error i{background:#d64545}
.layout{display:grid;grid-template-columns:340px 1fr;gap:28px;max-width:1120px;margin:28px auto;padding:0 20px}
.panel{display:flex;flex-direction:column;height:calc(100vh - 116px);min-height:540px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.panel-h{padding:18px 18px 12px}
.panel-h>div{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.panel-h h2{font-size:16px;font-weight:800}
.panel-h span{font-size:12.5px;font-weight:600;color:var(--muted)}
.panel-h input{-webkit-appearance:none;appearance:none;width:100%;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--tint);font-size:13.5px}
.panel-h input:focus{background:#fff;outline:2px solid var(--orange)}
.list{flex:1;overflow-y:auto;padding:4px 8px 10px}
.row{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:10px;border:0;border-radius:10px;background:none;text-align:left;cursor:pointer}
.row:hover{background:var(--tint)}
.row.on{background:#e4f1fd}
.row.on::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--orange)}
.av{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:#e4e9f0;color:var(--steel);font:700 16px var(--display)}
.row .t{flex:1;min-width:0}
.row b,.row small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row b{font-size:13.5px;font-weight:700}
.row small{font-size:12px;color:var(--muted)}
.row em{font-style:normal;font-size:11.5px;font-weight:700;color:var(--muted)}
.msg{padding:28px 16px;text-align:center;font-size:13px;line-height:1.5;color:var(--muted)}
.msg .btn{margin-top:12px}

.stage{display:flex;flex-direction:column;align-items:center;gap:22px}
.bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;width:100%;max-width:560px}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:#e1e6ed}
.seg button{border:0;border-radius:8px;background:none;padding:7px 18px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(14,27,46,.15)}
.acts{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:13px;font-weight:700;cursor:pointer}
.btn:hover{border-color:var(--steel)}
.btn.pri{border-color:var(--orange);background:var(--orange);color:#fff}
.btn.pri:hover{border-color:var(--orange-d);background:var(--orange-d)}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hint{font-size:12.5px;font-weight:600;color:var(--muted)}

/* ---------- Kartu ID (320 x 508, rasio CR80) ---------- */
.scene{perspective:1600px}
.id-card{width:320px;height:508px;border-radius:18px;cursor:pointer}
.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.id-card.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;overflow:hidden;border-radius:18px;background:#fff;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 24px 48px -16px rgba(10,18,67,.35),0 0 0 1px rgba(10,18,67,.06);font-family:var(--slab);color:var(--navy)}
.face.back{transform:rotateY(180deg)}
.bg{position:absolute;inset:0;width:100%;height:100%}
.lw{position:absolute;z-index:2;top:34px;left:0;right:0;text-align:center}
.lw img{display:inline-block;height:36px}
.photo{position:absolute;z-index:3;top:85px;left:50%;width:138px;height:138px;margin-left:-69px;overflow:hidden;border:5px solid #fff;border-radius:50%;background:#e4e9f0;box-shadow:0 6px 18px rgba(10,18,67,.3)}
.photo img{display:block;width:100%;height:100%;object-fit:cover}
.ini{display:grid;place-items:center;width:100%;height:100%;font:700 50px var(--display);letter-spacing:.02em;color:#1f3a8f}
.who{position:absolute;top:234px;left:0;right:0;padding:0 16px;text-align:center}
.nm{display:flex;align-items:center;justify-content:center;height:54px;font:400 25px/1.12 var(--slab);text-transform:uppercase;overflow:hidden}
.nm b{font-weight:800}
.nm span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.jb{display:inline-block;max-width:100%;margin-top:6px;padding:5px 16px;border-radius:6px;background:var(--blue);color:#fff;font:600 13px var(--slab);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb{position:absolute;left:16px;right:16px;display:grid;grid-template-columns:auto 1fr;gap:2px;overflow:hidden;border-radius:12px;background:#fff}
.tb b,.tb span{min-height:25px;padding:0 12px;background:var(--pale);font-size:11.5px;line-height:25px;white-space:nowrap}
.tb b{font-weight:700}
.tb span{min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;color:#1d2540}
.front .tb b,.front .tb span{min-height:30px;line-height:30px}
.qr{position:absolute;width:70px;height:70px;padding:5px;border:1px solid #cfe0f2;border-radius:8px;background:#fff}
.qr img,.qr canvas{display:block;width:100%!important;height:100%!important}
.fb{position:absolute;left:104px;right:24px;top:428px}
#bar{display:block;width:100%;height:30px}
.cap{margin-top:3px;font:800 8.5px var(--sans);text-align:center;white-space:nowrap;color:var(--navy)}
.bt{position:absolute;z-index:2;top:34px;left:20px;right:20px;text-align:center;font:500 9.5px/1.5 var(--slab);color:#fff}
.bt small{display:block;font:700 9px var(--slab);letter-spacing:.16em;text-transform:uppercase;color:#4db0fb}
.bt span{display:block;margin-top:3px;font-size:9px;line-height:1.38}
.lg{position:absolute;top:150px;left:0;right:0;text-align:center}
.lg img{height:36px}
.tt{position:absolute;top:194px;left:0;right:0;text-align:center;font:400 21px var(--slab)}
.tt b{font-weight:800}
.note{position:absolute;left:20px;right:20px;top:318px}
.note h3{margin-bottom:5px;font:700 11px var(--slab)}
.tm{display:grid;gap:3px;list-style:none}
.tm li{position:relative;padding-left:13px;font:500 9px/1.35 var(--sans);color:#2a3350}
.tm li::before{content:"";position:absolute;left:2px;top:4px;width:5px;height:5px;border-radius:50%;background:var(--blue)}
.bq{position:absolute;top:436px;left:20px;display:flex;gap:8px}
.bq>div{width:70px}
.bq .qr{position:static;width:56px;height:56px;padding:3px;margin:0 auto}

.slot{position:absolute;z-index:5;top:12px;left:50%;width:58px;height:12px;margin-left:-29px;border-radius:6px;background:var(--mist);box-shadow:inset 0 2px 4px rgba(10,18,67,.45),0 1px 0 rgba(255,255,255,.35)}
@media print{.slot{background:#fff;box-shadow:none;border:1px solid #9aa6b8}}

@media(max-width:900px){
  .layout{grid-template-columns:1fr;margin:16px auto}
  .stage{order:-1}
  .panel{height:420px;min-height:0}
  .top{padding:0 16px}
  .brand b{display:none}
}
@media(prefers-reduced-motion:reduce){.inner{transition:none}}

/* ---------- Cetak: depan + belakang, ukuran CR80 (54 x 85,6 mm) ---------- */
@media print{
  @page{size:A4;margin:12mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{min-height:0;background:none}
  .top,.panel,.bar,.hint{display:none}
  .layout{display:block;max-width:none;margin:0;padding:0}
  .stage{display:block}
  .scene{perspective:none}
  .id-card{width:auto;height:auto}
  .inner{display:flex;gap:8mm;transform:none!important;transform-style:flat;transition:none}
  .face{position:relative;inset:auto;flex:none;width:320px;height:508px;zoom:.6375;transform:none!important;backface-visibility:visible;box-shadow:none;border:1px solid #c5cdd9}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <img data-logo alt="PT Murinda Sentra Baja">
    <b>Digital Identity System</b>
  </div>
  <div class="sync" id="sync"><i></i><span id="syncTx">Memuat data…</span></div>
</header>

<main class="layout">
  <aside class="panel">
    <div class="panel-h">
      <div><h2>Karyawan</h2><span id="count"></span></div>
      <input id="q" type="search" placeholder="Cari nama, NIK, ID, atau jabatan" autocomplete="off" aria-label="Cari karyawan">
    </div>
    <div class="list" id="list"><div class="msg">Memuat data karyawan…</div></div>
  </aside>

  <section class="stage">
    <div class="bar">
      <div class="seg">
        <button id="bF" aria-pressed="true">Depan</button>
        <button id="bB" aria-pressed="false">Belakang</button>
      </div>
      <div class="acts">
        <button class="btn" id="bS"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>Sinkronkan</button>
        <button class="btn pri" id="bP"><svg viewBox="0 0 24 24"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>Cetak kartu</button>
      </div>
    </div>

    <div class="scene">
      <div class="id-card" id="card" tabindex="0" role="button" aria-label="Balik kartu">
        <div class="inner">

          <!-- DEPAN -->
          <div class="face front">
            <svg class="bg" viewBox="0 0 320 508" aria-hidden="true"><defs><clipPath id="cf"><path d="M0,0 H320 V72 L160,159 L0,72Z"/></clipPath><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1243" stop-opacity=".92"/><stop offset=".8" stop-color="#0a1243" stop-opacity="0"/></linearGradient></defs><path fill="#1590e8" d="M0,72 L125,140 L84,136 L66,148 Q60,152 54,148 L0,112Z"/><path fill="#1590e8" d="M320,72 L160,159 L206,218 Q214,226 224,220 L320,150Z"/><path fill="#0a1243" d="M0,0 H320 V72 L160,159 L0,72Z"/><g clip-path="url(#cf)"><image data-ws x="0" y="0" width="320" height="165" preserveAspectRatio="xMidYMid slice" opacity=".45"/><rect width="320" height="165" fill="url(#gf)"/></g><path fill="#1590e8" d="M215,508 L282,468 L320,486 V508Z"/><path fill="#0a1243" d="M60,508 L180,474 L320,508Z"/></svg>
            <div class="slot"></div>
            <div class="lw"><img data-logo-w alt="PT Murinda Sentra Baja"></div>
            <div class="photo">
              <img id="pic" alt="Foto karyawan" style="display:none">
              <div class="ini" id="ini">?</div>
            </div>
            <div class="who">
              <div class="nm"><span id="nm">—</span></div>
              <div class="jb" id="jb">—</div>
            </div>
            <div class="tb" style="top:338px">
              <b>Departemen</b><span id="dp">—</span>
              <b id="nikL">NIK</b><span id="nik">—</span>
            </div>
            <div class="qr" id="qrId" style="left:22px;top:422px"></div>
            <div class="fb"><svg id="bar"></svg></div>
          </div>

          <!-- BELAKANG -->
          <div class="face back">
            <svg class="bg" viewBox="0 0 320 508" aria-hidden="true"><defs><clipPath id="cb"><path d="M0,0 H320 V84 L160,138 L0,84Z"/></clipPath><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1243" stop-opacity=".92"/><stop offset=".8" stop-color="#0a1243" stop-opacity="0"/></linearGradient></defs><path fill="#1590e8" d="M0,84 L118,125 L94,148 L0,116Z"/><path fill="#0a1243" d="M0,0 H320 V84 L160,138 L0,84Z"/><g clip-path="url(#cb)"><image data-ws x="0" y="0" width="320" height="165" preserveAspectRatio="xMidYMid slice" opacity=".45"/><rect width="320" height="165" fill="url(#gb)"/></g><path fill="#1590e8" d="M232,508 L288,480 L320,494 V508Z"/><path fill="#0a1243" d="M176,508 L244,484 L320,508Z"/></svg>
            <div class="slot"></div>
            <div class="bt"><small>Alamat perusahaan</small><span id="ad"></span></div>
            <div class="lg"><img data-logo alt="PT Murinda Sentra Baja"></div>
            <div class="tt"><b>KARTU ID</b> KARYAWAN</div>
            <div class="tb" style="top:230px">
              <b>Golongan Darah</b><span id="gd">—</span>
              <b>Telepon</b><span id="ph"></span>
              <b>Email</b><span id="em"></span>
            </div>
            <div class="note"><h3>Ketentuan penggunaan</h3><ul class="tm" id="tm"></ul></div>
            <div class="bq">
              <div><div class="qr" id="qrMap"></div><div class="cap">Lokasi kantor</div></div>
              <div><div class="qr" id="qrSign"></div><div class="cap">Tanda tangan</div></div>
            </div>
          </div>

        </div>
      </div>
    </div>
    <p class="hint">Klik kartu untuk membalik.</p>
  </section>
</main>

/* Nama kolom Excel: ID_Karyawan, NIK_Karyawan, Nama_Lengkap, Foto_Profil,
   Jenis_Kelamin, Jabatan, Departemen, Digital Sign.
   Dicocokkan tanpa peduli huruf besar/kecil, spasi, atau underscore. */
const ALIAS = {
  id: ['idkaryawan', 'id'], nik: ['nikkaryawan', 'nik'], nama: ['namalengkap', 'nama'],
  foto: ['fotoprofil', 'foto'], fotoUrl: ['fotourl'], jk: ['jeniskelamin', 'gender'],
  jabatan: ['jabatan'], dept: ['departemen', 'dept'], sign: ['digitalsign', 'tandatangandigital', 'sign'],
  golda: ['golongandarah', 'goldarah', 'goldar', 'bloodtype'],
  verifyLink: ['verifylink', 'linkverifikasi']
};
const BAD = /^#(N\/A|REF!|ERROR!|VALUE!|NAME\?|DIV\/0!|NUM!|NULL!)/i;

const $ = id => document.getElementById(id);
const clean = v => { v = v == null ? '' : String(v).trim(); return BAD.test(v) || /^(undefined|null)$/i.test(v) ? '' : v; };
const nk = s => String(s).toLowerCase().replace(/[^a-z0-9]/g, '');
const esc = s => String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
const ini = n => String(n || '?').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();

function normalize(raw) {
  const m = {}, o = {};
  for (const k in raw) m[nk(k)] = raw[k];
  for (const f in ALIAS) {
    o[f] = '';
    for (const a of ALIAS[f]) { const v = clean(m[a]); if (v) { o[f] = v; break; } }
  }
  o.key = o.id || o.nama;
  return o;
}

let all = [], cur = '';

function setSync(state, text) { $('sync').className = 'sync ' + state; $('syncTx').textContent = text; }

async function load(silent) {
  if (!silent) setSync('', 'Memuat data…');
  try {
    const r = await fetch(CFG.url + '?action=list' + (CFG.token ? '&token=' + encodeURIComponent(CFG.token) : '') + '&_=' + Date.now(), { cache: 'no-store' });
    const j = await r.json();
    if (!j.success) throw new Error(j.error || 'Gagal memuat data');
    all = (j.data || []).map(normalize).filter(e => e.key);
    setSync('online', 'Tersinkron ' + new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }));
    if (!all.some(e => e.key === cur)) cur = all.length ? all[0].key : '';
    renderList();
    show();
  } catch (err) {
    setSync('error', 'Koneksi gagal');
    if (!all.length) $('list').innerHTML = '<div class="msg">Data belum bisa dimuat. Pastikan Web App sudah dideploy dengan akses “Siapa saja”, lalu coba lagi.<br><button class="btn" id="retry">Coba lagi</button></div>';
    const b = $('retry'); if (b) b.onclick = () => load();
  }
}

function renderList() {
  const q = $('q').value.trim().toLowerCase();
  const rows = all.filter(e => !q || [e.id, e.nik, e.nama, e.jabatan, e.dept].join(' ').toLowerCase().includes(q));
  $('count').textContent = rows.length === all.length ? all.length + ' orang' : rows.length + ' dari ' + all.length;
  const el = $('list');
  el.innerHTML = '';
  if (!rows.length) { el.innerHTML = '<div class="msg">Tidak ada karyawan yang cocok.</div>'; return; }
  rows.forEach(e => {
    const b = document.createElement('button');
    b.className = 'row' + (e.key === cur ? ' on' : '');
    b.innerHTML = `<span class="av">${esc(ini(e.nama))}</span><span class="t"><b>${esc(e.nama || '—')}</b><small>${esc(e.jabatan || '—')}</small></span><em>${esc(e.id)}</em>`;
    b.onclick = () => {
      cur = e.key;
      const on = el.querySelector('.on'); if (on) on.classList.remove('on');
      b.classList.add('on');
      show();
    };
    el.appendChild(b);
  });
}

function photoUrl(e) {
  if (e.fotoUrl) return e.fotoUrl;
  if (!e.foto) return '';
  return /^https?:/i.test(e.foto) ? e.foto
    : `https://www.appsheet.com/template/gettablefileurl?appName=${CFG.appsheet}&tableName=Karyawan&fileName=${encodeURIComponent(e.foto)}`;
}

const photoCache = {};  // key karyawan -> data URL foto (hanya yang berhasil)

// Ambil foto lewat server (akun pemilik script), jadi tetap tampil walau file Drive tidak publik
async function fetchPhoto(e) {
  if (photoCache[e.key]) return photoCache[e.key];
  let src = '';
  try {
    const r = await fetch(CFG.url + '?action=photo&id=' + encodeURIComponent(e.id) + (CFG.token ? '&token=' + encodeURIComponent(CFG.token) : ''), { cache: 'no-store' });
    const j = await r.json();
    if (j.success && j.dataUrl) src = j.dataUrl;
  } catch (_) {}
  if (src) photoCache[e.key] = src;
  return src;
}

function qr(id, text, low) {
  const el = $(id);
  el.innerHTML = '';
  new QRCode(el, { text: String(text), width: 160, height: 160, colorDark: '#0a1243', colorLight: '#ffffff', correctLevel: low ? QRCode.CorrectLevel.L : QRCode.CorrectLevel.M });
}

function show() {
  const e = all.find(x => x.key === cur);
  if (!e) return;
  const name = e.nama || '—';
  const pt = name.trim().split(/\s+/);
  $('nm').innerHTML = '<b>' + esc(pt[0]) + '</b>' + (pt.length > 1 ? ' ' + esc(pt.slice(1).join(' ')) : '');
  $('jb').textContent = e.jabatan || '—';
  $('dp').textContent = e.dept || '—';
  $('nikL').textContent = e.nik ? 'NIK' : 'ID Karyawan';
  $('nik').textContent = e.nik || e.id || '—';
  $('gd').textContent = e.golda || '—';

  const pic = $('pic'), av = $('ini'), key = e.key;
  av.textContent = ini(name);
  if (pic.dataset.key !== key) {  // ganti karyawan: tampilkan inisial dulu sampai foto siap
    av.style.display = 'grid';
    pic.style.display = 'none';
    pic.removeAttribute('src');
    delete pic.dataset.key;
  }
  if (e.foto || e.fotoUrl) {
    fetchPhoto(e).then(srv => {
      if (cur !== key) return;                    // pilihan sudah berganti
      const src = srv || photoUrl(e);             // cadangan: tautan langsung
      if (!src || (pic.dataset.key === key && pic.getAttribute('src') === src)) return;
      pic.onload = () => { pic.dataset.key = key; pic.style.display = 'block'; av.style.display = 'none'; };
      pic.onerror = () => { pic.style.display = 'none'; av.style.display = 'grid'; };
      pic.src = src;
    });
  }

  const code = e.nik || e.id || '';
  try {
    JsBarcode('#bar', code, { format: 'CODE128', width: code.length > 9 ? 1.1 : 1.35, height: 28, displayValue: false, margin: 0, lineColor: '#0a1243', background: 'transparent' });
  } catch (_) { $('bar').innerHTML = ''; }

  $('bar').setAttribute('preserveAspectRatio', 'none');
  // QR depan: pakai link pendek (kotak QR jarang & mudah discan); cadangan: URL panjang
  const vUrl = e.verifyLink || (CFG.verify ? CFG.verify + (CFG.verify.includes('?') ? '&' : '?') + 'action=verify&id=' + encodeURIComponent(e.id) : '');
  qr('qrId', vUrl || ['VERIFIED', e.id, e.nik, name, e.jabatan].join('|'), !e.verifyLink);
  qr('qrSign', /^https?:/i.test(e.sign) ? e.sign : 'SIGN|' + (e.id || name));
}

function flip(on) {
  const c = $('card');
  c.classList.toggle('flip', on === undefined ? !c.classList.contains('flip') : on);
  const f = c.classList.contains('flip');
  $('bF').setAttribute('aria-pressed', String(!f));
  $('bB').setAttribute('aria-pressed', String(f));
}

function renderBack() {
  $('ad').textContent = CFG.co.address;
  $('ph').textContent = CFG.co.phone;
  $('em').textContent = CFG.co.email;
  $('tm').innerHTML = CFG.terms.map(t => `<li>${esc(t)}</li>`).join('');
  qr('qrMap', CFG.co.maps);
}

$('card').addEventListener('click', () => flip());
$('card').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
$('bF').addEventListener('click', () => flip(false));
$('bB').addEventListener('click', () => flip(true));
$('bS').addEventListener('click', () => load());
$('bP').addEventListener('click', () => window.print());
$('q').addEventListener('input', renderList);

renderBack();
load();
setInterval(() => load(true), CFG.poll);
</script>
</body>
</html>
